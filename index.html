<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Color Matcher</title>
<style>
  :root {
    --ink: #16130f;
    --paper: #f3efe6;
    --line: rgba(255,255,255,0.22);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    background: #0a0a0a;
    color: var(--paper);
    font-family: ui-monospace, "SF Mono", "Roboto Mono", Menlo, monospace;
    overflow: hidden;
  }
  #stage { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* Camera area */
  #cam-wrap { position: relative; flex: 1; min-height: 0; background: #000; overflow: hidden; }
  video, canvas#frame { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  canvas#frame { visibility: hidden; }

  /* Reticle */
  #reticle {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 96px; height: 96px; pointer-events: none;
    transition: top .12s ease-out, left .12s ease-out;
  }
  #reticle .ring {
    position: absolute; inset: 0; border: 2px solid rgba(255,255,255,0.9);
    border-radius: 50%; box-shadow: 0 0 0 2px rgba(0,0,0,0.45), inset 0 0 0 2px rgba(0,0,0,0.45);
  }
  #reticle .dot {
    position: absolute; top: 50%; left: 50%; width: 6px; height: 6px;
    transform: translate(-50%,-50%); background: #fff; border-radius: 50%;
    box-shadow: 0 0 0 1.5px rgba(0,0,0,0.6);
  }

  /* Readout panel */
  #panel {
    background: var(--paper); color: var(--ink);
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    display: grid; grid-template-columns: 84px 1fr; gap: 16px; align-items: center;
  }
  #chip {
    width: 84px; height: 84px; border-radius: 10px; background: #ccc;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12);
  }
  #codes { display: flex; flex-direction: column; gap: 6px; }
  .code-row { display: flex; align-items: baseline; gap: 10px; }
  .code-label {
    font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase;
    color: #8a8378; width: 34px; flex: none;
  }
  .code-val { font-size: 19px; font-weight: 600; letter-spacing: 0.02em; }
  .code-val.hex { font-size: 26px; }
  .hint { grid-column: 1 / -1; font-size: 11px; color: #8a8378; letter-spacing: 0.04em; }

  /* Controls */
  #controls {
    position: absolute; left: 0; right: 0; bottom: 16px;
    display: flex; justify-content: center; gap: 14px; padding: 0 16px;
  }
  button {
    font-family: inherit; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    color: #fff; background: rgba(0,0,0,0.5); border: 1px solid var(--line);
    border-radius: 999px; padding: 11px 18px; backdrop-filter: blur(8px); cursor: pointer;
  }
  button:active { transform: scale(0.96); }
  button.lock-on { background: #fff; color: #111; border-color: #fff; }

  /* Start / error overlay */
  #overlay {
    position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px; padding: 32px; text-align: center;
    background: radial-gradient(circle at 50% 35%, #1b1814, #0a0a0a);
  }
  #overlay h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.04em; }
  #overlay p { font-size: 13px; line-height: 1.6; color: #b3ac9f; max-width: 320px; }
  #overlay button { background: #fff; color: #111; border-color: #fff; font-size: 13px; padding: 14px 26px; }
  .hidden { display: none !important; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 4; }
</style>
</head>
<body>
<div id="stage">
  <div id="cam-wrap">
    <video id="video" playsinline muted></video>
    <canvas id="frame"></canvas>
    <div id="reticle"><div class="ring"></div><div class="dot"></div></div>
    <div id="flash"></div>
    <div id="controls" class="hidden">
      <button id="lockBtn">Lock</button>
      <button id="copyBtn">Copy hex</button>
    </div>
    <div id="overlay">
      <h1>Color Matcher</h1>
      <p>Point your camera at your colors, then tap any swatch on screen to read its code. Tap to start — your browser will ask for camera access.</p>
      <button id="startBtn">Start camera</button>
    </div>
  </div>

  <div id="panel">
    <div id="chip"></div>
    <div id="codes">
      <div class="code-row"><span class="code-label">Hex</span><span class="code-val hex" id="hex">—</span></div>
      <div class="code-row"><span class="code-label">RGB</span><span class="code-val" id="rgb">—</span></div>
    </div>
    <div class="hint" id="hint">Tap a swatch to read it. Lock to freeze.</div>
  </div>
</div>

<script>
const video = document.getElementById('video');
const frame = document.getElementById('frame');
const ctx = frame.getContext('2d', { willReadFrequently: true });
const chip = document.getElementById('chip');
const hexEl = document.getElementById('hex');
const rgbEl = document.getElementById('rgb');
const hintEl = document.getElementById('hint');
const overlay = document.getElementById('overlay');
const controls = document.getElementById('controls');
const startBtn = document.getElementById('startBtn');
const lockBtn = document.getElementById('lockBtn');
const copyBtn = document.getElementById('copyBtn');
const flash = document.getElementById('flash');

let stream = null, locked = false, raf = null, lastHex = '';
// Sample point as a fraction of the frame (0..1). Starts centered.
let px = 0.5, py = 0.5;
// Rolling buffer of recent readings to smooth jitter.
const SMOOTH = 8;
let buf = [];

const reticle = document.getElementById('reticle');
const camWrap = document.getElementById('cam-wrap');

function toHex(n) { return n.toString(16).padStart(2, '0').toUpperCase(); }

function placeReticle() {
  reticle.style.left = (px * 100) + '%';
  reticle.style.top = (py * 100) + '%';
}

async function start() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    overlay.classList.add('hidden');
    controls.classList.remove('hidden');
    placeReticle();
    loop();
  } catch (err) {
    overlay.querySelector('h1').textContent = 'Camera unavailable';
    overlay.querySelector('p').textContent =
      'The camera could not start. Make sure this page is opened over HTTPS and that camera access is allowed in your browser settings, then reload.';
    startBtn.textContent = 'Try again';
  }
}

function sample() {
  const w = video.videoWidth, h = video.videoHeight;
  if (!w || !h) return;
  if (frame.width !== w) { frame.width = w; frame.height = h; }
  ctx.drawImage(video, 0, 0, w, h);
  // Larger ~25x25 block, clamped to frame edges, centered on the chosen point.
  const r = 12;
  let cx = Math.round(px * w), cy = Math.round(py * h);
  cx = Math.max(r, Math.min(w - r - 1, cx));
  cy = Math.max(r, Math.min(h - r - 1, cy));
  const data = ctx.getImageData(cx - r, cy - r, r * 2 + 1, r * 2 + 1).data;
  let rs = 0, gs = 0, bs = 0, count = data.length / 4;
  for (let i = 0; i < data.length; i += 4) { rs += data[i]; gs += data[i+1]; bs += data[i+2]; }
  // Push this frame's average into the rolling buffer, then average the buffer.
  buf.push([rs / count, gs / count, bs / count]);
  if (buf.length > SMOOTH) buf.shift();
  let ar = 0, ag = 0, ab = 0;
  for (const c of buf) { ar += c[0]; ag += c[1]; ab += c[2]; }
  const R = Math.round(ar / buf.length), G = Math.round(ag / buf.length), B = Math.round(ab / buf.length);
  const hex = '#' + toHex(R) + toHex(G) + toHex(B);
  lastHex = hex;
  hexEl.textContent = hex;
  rgbEl.textContent = `${R}, ${G}, ${B}`;
  chip.style.background = hex;
}

function loop() {
  if (!locked) sample();
  raf = requestAnimationFrame(loop);
}

// Tap anywhere on the camera to move the sample point there.
camWrap.addEventListener('pointerdown', (e) => {
  if (overlay && !overlay.classList.contains('hidden')) return; // ignore before start
  const rect = camWrap.getBoundingClientRect();
  const nx = (e.clientX - rect.left) / rect.width;
  const ny = (e.clientY - rect.top) / rect.height;
  if (nx < 0 || nx > 1 || ny < 0 || ny > 1) return;
  px = nx; py = ny;
  buf = [];                 // clear smoothing so the new spot reads immediately
  placeReticle();
  if (locked) {             // a tap while locked resumes live reading
    locked = false;
    lockBtn.textContent = 'Lock';
    lockBtn.classList.remove('lock-on');
    hintEl.textContent = 'Tap a swatch to read it. Lock to freeze.';
  }
});

startBtn.addEventListener('click', start);

lockBtn.addEventListener('click', () => {
  locked = !locked;
  lockBtn.textContent = locked ? 'Unlock' : 'Lock';
  lockBtn.classList.toggle('lock-on', locked);
  hintEl.textContent = locked ? 'Reading frozen. Tap a swatch or Unlock to resume.' : 'Tap a swatch to read it. Lock to freeze.';
  if (locked) { flash.style.transition = 'none'; flash.style.opacity = '0.7';
    requestAnimationFrame(() => { flash.style.transition = 'opacity .35s'; flash.style.opacity = '0'; }); }
});

copyBtn.addEventListener('click', async () => {
  if (!lastHex) return;
  try { await navigator.clipboard.writeText(lastHex); }
  catch (e) {}
  const prev = copyBtn.textContent;
  copyBtn.textContent = 'Copied ' + lastHex;
  setTimeout(() => { copyBtn.textContent = prev; }, 1200);
});

window.addEventListener('pagehide', () => { if (stream) stream.getTracks().forEach(t => t.stop()); });
</script>
</body>
</html>
